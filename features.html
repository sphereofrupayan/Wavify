<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wavify</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

nav {
  font-family: Georgia, 'Times New Roman', Times, serif;
}

nav ul {
  display: flex;
  align-items: center;
  list-style-type: none;
  height: 65px;
  background: rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: white;
  padding: 0 20px;
}

nav ul li.brand {
  padding: 0 8px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 1.2rem;
  letter-spacing: 2px;
}

nav ul li.nav-links {
  margin-left: auto; 
  display: flex;
  gap: 8px;
}

nav ul li.nav-links a {
  text-decoration: none;
  font-weight: bolder;
  cursor: pointer;
  color: white;
  transition: 0.3s;
  padding: 0 8px;
}

nav ul li.nav-links a:hover {
  color: #1da9c0;
}


@media (max-width: 768px) {
  nav ul li.nav-links {
    margin-left: 12px;
  }
}
.brand {
    animation: neonGlow 1.5s ease-in-out infinite alternate;
}

@keyframes neonGlow {
    from {
        text-shadow:
            0 0 5px #0ff,
            0 0 10px #0ff;
    }
    to {
        text-shadow:
            0 0 10px #0ff,
            0 0 20px #0ff,
            0 0 40px #0ff;
    }
}
      #bgVideo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: whitesmoke;
  font-family: sans-serif;
  overflow-x: hidden;
}


.carousel-section {
  width: 100%;
  padding: 30px 0;
}


.carousel-outer {
  width: 75%;
  margin: auto;
  overflow: hidden;
  position: relative;
}


.carousel-outer::before,
.carousel-outer::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 100px;
  z-index: 5;
  pointer-events: none;
}

.carousel-outer::before {
  left: 0;
  background: linear-gradient(to right, #0d0d0f, transparent);
}

.carousel-outer::after {
  right: 0;
  background: linear-gradient(to left, #0d0d0f, transparent);
}


.carousel-track {
  display: flex;
  gap: 22px;                  
  width: max-content;
  animation: scrollRow 20s linear infinite;
}


.carousel-outer:hover .carousel-track {
  animation-play-state: paused;
}

@keyframes scrollRow {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}


.card-wrap {
  width: 60px;             
  height: 60px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}


.card-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
  transition: transform 0.25s ease;
}


.card-wrap:hover img {
  transform: scale(1.12);
}

.heading {
  text-align: center;
  margin-top: -5px;
}

.heading h2 {
  font-size: 4rem;
  font-family: 'Orbitron', 'Montserrat', sans-serif;
  font-weight: 700;
  letter-spacing: 12px;
  background: linear-gradient(90deg, #ff00ff, #00ffff, #00ff88, #ffea00);
  background-size: 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientMove 4s linear infinite, zoomIn 1.5s ease forwards;
}


@keyframes gradientMove {
  0% { background-position: 0%; }
  100% { background-position: 300%; }
}

@keyframes zoomIn {
  0% {
    transform: scale(0.5);
    opacity: 0;
    letter-spacing: 25px;
  }
  100% {
    transform: scale(1);
    opacity: 1;
    letter-spacing: 12px;
  }
}
.heading h3 {
  margin-top: 20px;
  font-size: 1.5rem;
  font-family: 'Montserrat', sans-serif;
  color: #ffffffcc;
  letter-spacing: 2px;
  overflow: hidden;
  white-space: normal;
  text-align: center;
  width: 100%;
}
@media (max-width: 768px) {
  .heading h3 {
    white-space: normal;
    width: 100%;
    animation: none;
  }
}


@keyframes typing {
  0% { width: 0 }
  100% { width: 100% }
}

.heading h3:last-child {
  font-weight: bolder;
  font-size: 0.7rem;
  opacity: 0.7;
}

.logo {
  text-align: center;  
  margin-bottom: 0;
}

.logo img {
  width: 400px;       
  height: auto;
  display: inline-block;
}
    </style>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const logos = [
    {src: "logos/emailjs.png"},
    {src: "logos/HTML.png"},
    {src: "logos/Javascript.png"},
    {src: "logos/react.png"},
    {src: "logos/CSS.png"},
    {src: "logos/github.png"},
    {src: "logos/gpt.png"},
    {src: "logos/gemini.png"},
    {src: "logos/canva.png"},
    {src: "logos/claude.png"},
    {src: "logos/figma.png"},   
    {src: "logos/youtube.png"},
    {src: "logos/copilot.png"},
    {src: "logos/spotify.png"},
  ];

  const track = document.getElementById('track');

  function makeLogo(s) {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';

    const img = document.createElement('img');
    img.src = s.src;

    wrap.appendChild(img);
    return wrap;
  }


  for (let i = 0; i < 4; i++) {
    logos.forEach(l => track.appendChild(makeLogo(l)));
  }

});
</script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
  <ul>
    <li class="brand">Wavify</li>
    <li class="nav-links">
      <a href="index.html">Home</a>
      <a href="features.html">About</a>
      <a href="about.html">Contact Us</a>
      
    </li>
  </ul>
</nav>
  <video autoplay muted loop id="bgVideo">
  <source src="background.mp4" type="video/mp4">
</video>
      <header class="hero">
    <div class="divider"></div>
  </header>

  <section class="carousel-section">
    <div class="carousel-outer">
      <div class="carousel-track" id="track"></div>
    </div>
  </section>
  <section class="logo">
    <img src="wavify.png" alt="">
  </section>
  <section class="heading">
    <h2>Wavify</h2>
    <h3>Because every mood sounds different.</h3>
    <h3>V 2.0</h3>
  </section>
</body>
</html>
